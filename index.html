<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <meta name="description" content="ABD borsası kişisel takip. Kendi yöntemimiz; yatırım tavsiyesi değildir.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Defter">
  <title>Borsa Defteri</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="ust">
    <div class="ust-ic">
      <img src="icon.svg" alt="" width="28" height="28">
      <h1 id="baslik">Borsa Defteri</h1>
      <span id="demo-rozet" class="rozet" hidden>Örnek veri</span>
      <button id="yenile" class="ikon-dugme" type="button" aria-label="Yenile" title="Yenile">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="icerik" tabindex="-1"></main>

  <footer class="dipnot">Kendi yöntemimiz; eğitim ve kişisel takip amaçlıdır, <strong>yatırım tavsiyesi değildir</strong>. Veriler: Finnhub; Zincir ve ORB: Yahoo, FinViz, Reddit, StockTwits.</footer>

  <nav class="sekmeler" aria-label="Ekranlar">
    <a href="#portfoy" data-sekme="portfoy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Portföy</span></a>
    <a href="#analiz" data-sekme="analiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Analiz</span></a>
    <a href="#zincir" data-sekme="zincir">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Zincir</span></a>
    <a href="#insider" data-sekme="insider">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M17 7v6m-3-3h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Insider</span></a>
    <a href="#orb" data-sekme="orb">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M3 15h18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><path d="M4 18l4-5 3 2 5-9 4 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ORB</span></a>
    <a href="#ayarlar" data-sekme="ayarlar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10m4 0h2M4 12h4m4 0h8M4 18h12m4 0h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Ayarlar</span></a>
  </nav>

  <dialog id="poz-dialog" aria-labelledby="poz-baslik">
    <form id="poz-form" method="dialog">
      <h2 id="poz-baslik">Pozisyon</h2>
      <label>Hisse kodu<input name="t" required autocomplete="off" autocapitalize="characters" placeholder="ör. AMD, BRK.B" maxlength="10"></label>
      <div class="iki">
        <label>Adet<input name="adet" type="number" step="any" min="0" required inputmode="decimal"></label>
        <label>Maliyet ($/hisse)<input name="maliyet" type="number" step="any" min="0" inputmode="decimal"></label>
      </div>
      <label>Dayanak hisse <small>(isteğe bağlı, kaldıraçlı ETF için: TSLL → TSLA)</small><input name="dayanak" autocomplete="off" autocapitalize="characters" maxlength="10"></label>
      <label>Not<input name="not" autocomplete="off" maxlength="80"></label>
      <div class="dugmeler">
        <button type="button" id="poz-sil" class="dugme tehlike">Sil</button>
        <span class="bosluk"></span>
        <button type="button" id="poz-vazgec" class="dugme ikincil">Vazgeç</button>
        <button type="submit" class="dugme">Kaydet</button>
      </div>
    </form>
  </dialog>

  <div id="bildirim" class="bildirim" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
